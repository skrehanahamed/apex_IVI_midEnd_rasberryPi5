name: Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package-release:
    name: Package Raspberry Pi 5 IVI Bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Release Notes
        run: |
          python3 scripts/generate_release_notes.py "${{ github.ref_name }}"

      - name: Create Release Archive
        run: |
          mkdir -p dist
          tar -czvf dist/apex-ivi-rpi5-configs.tar.gz rpi5/
          zip -r dist/apex-ivi-source-${{ github.ref_name }}.zip src/ qml/ assets/ CMakeLists.txt resources.qrc rpi5/ README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Apex HORIZON IVI - Raspberry Pi 5 Platform ${{ github.ref_name }}"
          body_path: release_body.md
          files: |
            dist/apex-ivi-rpi5-configs.tar.gz
            dist/apex-ivi-source-${{ github.ref_name }}.zip

      - name: Force Update Release Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --title "Apex HORIZON IVI - Raspberry Pi 5 Platform ${{ github.ref_name }}" --notes-file release_body.md
